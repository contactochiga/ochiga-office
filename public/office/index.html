<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ochiga Office</title>
<meta name="robots" content="noindex" />
<!-- PWA (Ecosystem Standardization Programme 14). Icons render the same
     gradient-square "O" mark Ochiga-website already ships as its own
     favicon/apple-touch-icon (app/icon.tsx, app/apple-icon.tsx). -->
<link rel="manifest" href="/office/manifest.json" />
<link rel="icon" href="/office/brand/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/office/brand/icon-192.png" />
<meta name="theme-color" content="#050505" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ochiga Office" />
<style>
  /* ---------------------------------------------------------------
     Design tokens — restrained Ochiga red/black, shared in spirit
     with the corporate website's palette, but sans-serif and
     information-dense: this is an operating environment, not an
     editorial page. Phase 1 scope: shell, nav, layout, tokens,
     persistent intelligence control, shared states.
  ----------------------------------------------------------------*/
  :root {
    --black: #050505;
    --charcoal: #12120f;
    --graphite: #1c1c19;
    --line: rgba(246, 243, 236, 0.1);
    --line-strong: rgba(246, 243, 236, 0.18);
    --warmwhite: #f6f3ec;
    --white: #ffffff;
    --grey-100: #f5f4f2;
    --grey-300: #d8d5cf;
    --grey-500: #8c887f;
    --grey-700: #57534a;
    --red: #b3241b;
    --red-muted: #8a1e17;
    --red-bright: #d3372c;
    --amber: #c9862b;
    --green: #3f8f5f;
    /* Universal Oyi Interaction Shell (Programme 2/3 cross-repo audit) —
       the canonical "Oyi is speaking as itself" identity color, decided
       against ochiga.com.ng and getoyi.com's existing #3B82F6 usage
       (Oyi Consumer/Facility currently use #2563eb/#38bdf8 and will
       reconcile to this value when they adopt the shared shell). Not
       used for general Office chrome — Ochiga red remains that here —
       only for shell surfaces that need to represent Oyi's own identity
       distinct from the host product's branding. */
    --oyi-blue: #3b82f6;

    --text-primary: var(--warmwhite);
    --text-secondary: var(--grey-300);
    --text-tertiary: var(--grey-500);

    --radius-sm: 3px;
    --radius: 5px;
    --nav-width: 232px;
    --topbar-height: 56px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Consolas", monospace;

    --duration-fast: 120ms;
    --duration-base: 220ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--black);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* body/#root are fixed at 100vh on purpose (app-shell pattern, no
     page bounce-scroll) — the actual scrollable surface is
     .view-outlet. That only works if every ancestor between #root and
     .view-outlet can shrink to its allotted space instead of growing
     with content: grid/flex items default to min-height:auto, which
     lets them overflow their track/flex-basis instead of clipping —
     the earlier root cause of "long pages get cut off below the
     viewport" with nothing to scroll. */
  #root { height: 100vh; width: 100vw; overflow: hidden; }
  a { color: inherit; }
  button { font-family: inherit; }
  ::selection { background: rgba(179, 36, 27, 0.35); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------------------------------------------------------------
     Login
  ----------------------------------------------------------------*/
  .login-screen {
    display: none;
    height: 100vh;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(179, 36, 27, 0.08), transparent 45%),
      var(--black);
  }
  body.auth-logged-out .login-screen { display: flex; }
  body.auth-logged-out .app-shell { display: none; }
  body.auth-logged-out .oyi-control { display: none; }

  .login-card {
    width: min(360px, 92vw);
    border: 1px solid var(--line);
    background: var(--charcoal);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  .login-brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
  }
  .login-brand .mark {
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    background: var(--red); flex-shrink: 0;
  }
  .login-brand span {
    font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary);
  }
  .login-card h1 {
    font-size: 19px; font-weight: 600; margin: 0 0 6px; color: var(--white);
  }
  .login-card p.sub {
    margin: 0 0 22px; color: var(--text-tertiary); font-size: 12.5px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--text-tertiary);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input {
    width: 100%; padding: 9px 11px; border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong); background: rgba(255,255,255,0.02);
    color: var(--white); font-size: 13.5px; outline: none;
    transition: border-color var(--duration-fast) var(--ease);
  }
  .field input:focus { border-color: var(--red); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-sm); border: 1px solid transparent;
    font-size: 13px; font-weight: 500; padding: 9px 16px; cursor: pointer;
    transition: background var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
  }
  .btn-primary { background: var(--red); color: var(--white); width: 100%; margin-top: 6px; }
  .btn-primary:hover { background: var(--red-bright); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--line-strong); }
  .btn-ghost:hover { color: var(--white); border-color: var(--grey-500); }
  .form-error {
    display: none; font-size: 12px; color: var(--red-bright);
    background: rgba(179, 36, 27, 0.1); border: 1px solid rgba(179, 36, 27, 0.3);
    border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 14px;
  }
  .form-error.visible { display: block; }

  /* ---------------------------------------------------------------
     App shell
  ----------------------------------------------------------------*/
  .app-shell {
    display: grid;
    grid-template-columns: var(--nav-width) 1fr;
    height: 100vh;
    width: 100vw;
  }

  .nav-rail {
    background: var(--charcoal);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 16px 12px;
    overflow-y: auto;
    min-height: 0; /* grid item — see #root comment above */
  }
  .nav-brand {
    display: flex; align-items: center;
    padding: 4px 8px 18px;
  }
  /* Official Ochiga mark (dark-background variant — transparent PNG,
     white wordmark). The mark already reads "OCHIGA", so no adjacent
     text is rendered here (was "Ochiga Office", a duplicated brand
     name next to a plain color swatch). */
  .nav-brand .logo-mark { height: 22px; width: auto; display: block; }

  .nav-group { margin-bottom: 18px; }
  .nav-group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-tertiary); padding: 0 8px; margin-bottom: 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; background: none; border: none;
    color: var(--text-secondary); font-size: 13px; padding: 8px 8px;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
  }
  .nav-item .dot {
    width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.35; flex-shrink: 0;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
  .nav-item.active { background: rgba(179, 36, 27, 0.12); color: var(--white); }
  .nav-item.active .dot { background: var(--red-bright); opacity: 1; }

  /* Shell-level identity block — lives at the bottom of the nav rail
     (see markup comment above #navFooter). Sticky within the rail's
     own scroll container and pushed to the bottom via margin-top:auto
     when the nav list is short, so it stays on-screen whether the
     operating-areas list is short or long, and persists across every
     route (nothing in office.js ever unmounts it — only nav-open,
     which toggles the whole rail's visibility on mobile, same as the
     rest of the sidebar). */
  .nav-footer {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; margin-top: auto; padding: 12px 8px 4px;
    border-top: 1px solid var(--line);
    position: sticky; bottom: 0;
    background: var(--charcoal);
  }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--graphite);
    border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0;
    position: relative; overflow: hidden;
  }
  .avatar .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar.avatar-editable { cursor: pointer; }
  .avatar.avatar-editable::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.12s;
  }
  .avatar.avatar-editable:hover::after { opacity: 1; }
  .avatar.avatar-editable .avatar-edit-glyph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--white); opacity: 0; transition: opacity 0.12s; pointer-events: none;
  }
  .avatar.avatar-editable:hover .avatar-edit-glyph { opacity: 1; }
  .nav-footer .who { min-width: 0; flex: 1; }
  .nav-footer .who .name { font-size: 12px; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-footer .who .role { font-size: 10.5px; color: var(--text-tertiary); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-footer button {
    background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 11px;
    padding: 4px; flex-shrink: 0;
  }
  .nav-footer button:hover { color: var(--red-bright); }

  .main-column { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .topbar {
    height: var(--topbar-height); flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px;
    gap: 12px;
  }
  .topbar > div:first-child { min-width: 0; overflow: hidden; }
  .topbar-title { font-size: 14px; font-weight: 600; color: var(--white); flex-shrink: 0; }
  .topbar-meta { font-size: 11.5px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-toggle { display: none; }

  .topbar-actions { position: relative; display: flex; align-items: center; flex-shrink: 0; }
  .notif-bell {
    position: relative; background: none; border: none; color: var(--text-secondary);
    font-size: 15px; cursor: pointer; padding: 6px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .notif-bell:hover { color: var(--white); background: rgba(255,255,255,0.04); }
  .notif-badge {
    position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 999px; background: var(--red-bright); color: var(--white);
    font-size: 9.5px; font-weight: 700; line-height: 15px; text-align: center;
  }
  .notif-panel {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
    width: min(360px, calc(100vw - 32px)); max-height: min(420px, calc(100vh - 100px));
    background: var(--charcoal); border: 1px solid var(--line-strong); border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55); overflow-y: auto;
  }
  .notif-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--charcoal);
  }
  .notif-panel-head h3 { font-size: 12px; color: var(--white); margin: 0; text-transform: uppercase; letter-spacing: 0.04em; }
  .notif-panel-head button { background: none; border: none; color: var(--text-tertiary); font-size: 11px; cursor: pointer; }
  .notif-panel-head button:hover { color: var(--white); }
  .notif-item {
    display: flex; flex-direction: column; gap: 3px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--graphite); }
  .notif-item.unread { background: rgba(179, 36, 27, 0.06); }
  .notif-item.unread::before { content: ""; }
  .notif-item .notif-summary { font-size: 12px; color: var(--text-primary); line-height: 1.45; }
  .notif-item.unread .notif-summary { color: var(--white); font-weight: 600; }
  .notif-item .notif-meta { font-size: 10.5px; color: var(--text-tertiary); }
  .notif-empty { padding: 24px 16px; text-align: center; font-size: 12px; color: var(--text-tertiary); }

  .view-outlet { flex: 1; overflow-y: auto; padding: 24px 28px 120px; min-height: 0; }
  .view-outlet .view-heading { margin-bottom: 20px; }
  .view-outlet .view-heading h1 {
    font-size: 18px; font-weight: 600; color: var(--white); margin: 0 0 4px;
  }
  .view-outlet .view-heading p {
    font-size: 12.5px; color: var(--text-tertiary); margin: 0; max-width: 640px;
  }

  /* ---------------------------------------------------------------
     Shared state primitives (loading / empty / error / phase-notice)
  ----------------------------------------------------------------*/
  .state-panel {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: rgba(255,255,255,0.015);
    padding: 28px 24px; max-width: 560px;
  }
  .state-panel .state-icon {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); color: var(--text-tertiary); margin-bottom: 12px;
  }
  .state-panel.error .state-icon { background: rgba(179, 36, 27, 0.1); color: var(--red-bright); }
  .state-panel .kicker {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-tertiary); margin-bottom: 8px;
  }
  .state-panel h2 { font-size: 14.5px; font-weight: 600; color: var(--white); margin: 0 0 8px; }
  .state-panel p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin: 0; }
  .state-panel.error { border-color: rgba(179, 36, 27, 0.35); }
  .state-panel.error .kicker { color: var(--red-bright); }

  .skeleton-line {
    height: 11px; border-radius: 3px; background: rgba(255,255,255,0.05);
    animation: pulse 1.4s ease-in-out infinite; margin-bottom: 8px;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .phase-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--amber); border: 1px solid rgba(201, 134, 43, 0.35);
    background: rgba(201, 134, 43, 0.08); padding: 3px 8px; border-radius: 20px;
    margin-bottom: 14px;
  }

  /* ---------------------------------------------------------------
     Persistent Oyi intelligence control
  ----------------------------------------------------------------*/
  /* Edge-docked Universal Interaction Shell control (Oyi Consumer
     visual basis, red accent here — see docking.mjs). .oyi-control is
     purely the orb's own positioning anchor now; .oyi-panel and
     .oyi-minimized-bar are independently `position: fixed`, placed by
     office.js from resolveDockedState()'s openDirection so they always
     expand inward from whichever of the 6 anchors the orb is docked
     to, never off-screen. */
  .oyi-control { position: fixed; right: 20px; bottom: 20px; z-index: 40; }
  /* Canonical Oyi orb — the closed-state identity for the Universal
     Interaction Shell, shared visual language across every Oyi
     surface (Office red here, Oyi blue elsewhere). A restrained,
     self-contained circular mark, not a labeled pill. Draggable via
     wireOyiControl() in office.js using the shared docking engine;
     position persists per browser. */
  .oyi-orb {
    width: 54px; height: 54px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle at 32% 28%, var(--red-bright), var(--red-muted) 55%, var(--charcoal) 100%);
    border: 1px solid var(--line-strong);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 0 0 0 rgba(179,36,27,0.45);
    cursor: grab; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
    touch-action: none;
  }
  .oyi-orb:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 0 0 6px rgba(179,36,27,0.12); }
  .oyi-orb:focus-visible { outline: 2px solid var(--red-bright); outline-offset: 3px; }
  .oyi-control.dragging .oyi-orb { cursor: grabbing; transform: scale(1.04); }
  .oyi-control.open .oyi-orb, .oyi-control.minimized .oyi-orb { display: none; }
  .oyi-orb-core {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--red-bright) 60%);
    box-shadow: 0 0 10px 2px rgba(179,36,27,0.55);
  }
  .oyi-avatar-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 32% 28%, var(--red-bright), var(--red-muted) 55%, var(--charcoal) 100%);
    box-shadow: 0 0 0 1px var(--line-strong);
  }

  .oyi-panel {
    position: fixed;
    width: min(400px, calc(100vw - 40px));
    max-height: min(560px, calc(100vh - 120px));
    background: var(--charcoal); border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    display: none; flex-direction: column; overflow: hidden;
    z-index: 41;
  }
  .oyi-control.open .oyi-panel { display: flex; }
  .oyi-panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .oyi-panel-head .title-group { flex: 1; min-width: 0; }
  .oyi-panel-head .title { font-size: 12.5px; color: var(--white); font-weight: 600; line-height: 1.3; }
  .oyi-panel-head .subtitle { font-size: 10.5px; color: var(--text-tertiary); line-height: 1.3; }
  .oyi-panel-head .context { font-size: 10.5px; color: var(--text-tertiary); }
  .oyi-panel-head button {
    background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 15px; line-height: 1;
    width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .oyi-panel-head button:hover { color: var(--white); background: rgba(255,255,255,0.06); }

  /* Minimized state — distinct from closed. Keeps the active
     conversation's presence visible without the full panel, per the
     Universal Shell spec: minimize must never equal close. */
  .oyi-minimized-bar {
    position: fixed;
    display: none; align-items: center; gap: 10px;
    min-width: 220px;
    background: var(--charcoal); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 8px 10px 8px 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 41;
  }
  .oyi-control.minimized .oyi-minimized-bar { display: flex; }
  .oyi-minimized-text { flex: 1; min-width: 0; }
  .oyi-minimized-title { font-size: 12px; font-weight: 600; color: var(--white); line-height: 1.3; }
  .oyi-minimized-subtitle { font-size: 10px; color: var(--text-tertiary); line-height: 1.3; }
  .oyi-minimized-bar button {
    background: none; border: none; color: var(--text-tertiary); cursor: pointer;
    width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .oyi-minimized-bar button:hover { color: var(--white); background: rgba(255,255,255,0.06); }

  .oyi-thread { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .oyi-msg { max-width: 88%; font-size: 12.5px; line-height: 1.55; padding: 8px 11px; border-radius: var(--radius); }
  .oyi-msg.user { align-self: flex-end; background: rgba(179, 36, 27, 0.16); color: var(--white); }
  .oyi-msg.assistant { align-self: flex-start; background: rgba(255,255,255,0.04); color: var(--text-primary); border: 1px solid var(--line); }
  .oyi-msg.system { align-self: center; color: var(--text-tertiary); font-size: 11.5px; background: none; }

  .oyi-composer {
    border-top: 1px solid var(--line); padding: 10px 12px;
    display: flex; align-items: flex-end; gap: 8px;
  }
  .oyi-composer textarea {
    flex: 1; resize: none; border: 1px solid var(--line-strong); background: rgba(255,255,255,0.02);
    color: var(--white); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px;
    font-family: inherit; outline: none; max-height: 96px;
  }
  .oyi-composer textarea:focus { border-color: var(--red); }
  .oyi-composer button {
    background: var(--red); border: none; color: var(--white); border-radius: var(--radius-sm);
    width: 32px; height: 32px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .oyi-composer button:hover { background: var(--red-bright); }
  .oyi-composer button:disabled { opacity: 0.4; cursor: default; }

  .oyi-quick-prompts { display: none; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .quick-prompt {
    font-size: 11.5px; color: var(--text-secondary); background: rgba(255,255,255,0.03);

  ----------------------------------------------------------------*/

  /* Home */
  .home-section { margin-bottom: 28px; }
  .home-section h3 {
    font-size: 12.5px; font-weight: 600; color: var(--white); margin: 0 0 12px;

  .attention-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .attention-row {

  .kpi-grid {

  .kpi-card {

  .kpi-card.clickable:hover { border-color: var(--red-muted); background: var(--graphite); }
  .kpi-card .kpi-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary);
  }
  .kpi-card .kpi-value { font-size: 22px; font-weight: 600; color: var(--white); line-height: 1; }
  .kpi-card .kpi-sub { font-size: 11px; color: var(--text-tertiary); }
  .kpi-card.kpi-alert .kpi-value { color: var(--red-bright); }

  .toast-host {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast {
    background: var(--charcoal); border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 10px 16px; font-size: 12.5px; color: var(--text-primary);

  }

  /* CRM tabs */
  .crm-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .crm-tab {
    background: none; border: none; color: var(--text-tertiary); font-size: 12.5px;

  }

  .overview-section { margin-bottom: 26px; }
  .overview-section h3 {
    font-size: 12.5px; font-weight: 600; color: var(--white); margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px;
  }

  .stage-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .stage-chip {
    display: flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong);
    border-radius: 20px; padding: 5px 12px 5px 6px; font-size: 12px; color: var(--text-secondary);

  .stage-count {

  /* List toolbar */
  .list-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar-search, .toolbar-filter {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line-strong); color: var(--white);

  /* Data table — grid-based, reflows to stacked cards on mobile */
  .crm-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .crm-row { display: grid; gap: 10px; padding: 10px 14px; align-items: center; border-bottom: 1px solid var(--line); background: var(--charcoal); }

  .crm-row-head { background: rgba(255,255,255,0.02); }
  .crm-row-head .cell { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); }

  /* Detail shell */
  .detail-back { background: none; border: none; color: var(--text-tertiary); font-size: 12px; cursor: pointer; margin-bottom: 14px; padding: 0; }
  .detail-back:hover { color: var(--white); }
  .detail-header { margin-bottom: 22px; }
  .detail-typeline { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--red-bright); margin-bottom: 4px; }
  .detail-header h1 { font-size: 19px; font-weight: 600; color: var(--white); margin: 0 0 8px; }
  .detail-badges { display: flex; gap: 6px; }
  .detail-body { display: grid; grid-template-columns: 1fr 280px; gap: 28px; align-items: start; }
  .detail-main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .detail-rail { display: flex; flex-direction: column; gap: 14px; }
  .detail-section h3 { font-size: 12.5px; font-weight: 600; color: var(--white); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em; }

  .status-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .status-actions .btn { margin-top: 0; width: auto; }
  .status-actions .form-status { font-size: 11.5px; color: var(--text-tertiary); }

  .proposal-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .proposal-body h3 { font-size: 14px; color: var(--white); margin: 18px 0 8px; }
  .proposal-body h3:first-child { margin-top: 0; }
  .proposal-body h4 { font-size: 12.5px; color: var(--white); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .proposal-body p { margin: 0 0 8px; }
  .proposal-body ul { margin: 0 0 10px; padding-left: 18px; }
  .proposal-body li { margin-bottom: 4px; }

  .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .fact { display: flex; flex-direction: column; gap: 3px; }
  .fact-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); }
  .fact-value { font-size: 13px; color: var(--text-primary); }

  .rail-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: rgba(255,255,255,0.015); }
  .rail-card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); margin: 0; }
  .rail-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .rail-card-head .btn { margin-top: 0; width: auto; }
  .rail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
  .rail-list a { color: var(--white); text-decoration: none; }
  .rail-list a:hover { color: var(--red-bright); }
  .rail-sub { color: var(--text-tertiary); font-size: 11px; margin-left: 4px; }
  .rail-empty { color: var(--text-tertiary); font-size: 12px; margin: 0; }
  .quick-filters { gap: 6px; }
  .quick-filters .btn { margin-top: 0; width: auto; }

  /* Inline forms (lead update, dialogs) */
  .inline-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .inline-form label { display: flex; flex-direction: column; gap: 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); }
  .inline-form input, .inline-form textarea {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line-strong); color: var(--white);
    border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12.5px; font-family: inherit; min-width: 160px;
  }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--red); outline: none; }
  .form-status { font-size: 11.5px; color: var(--text-tertiary); }

  /* Timeline */
  .timeline-block { }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head h3 { font-size: 12.5px; font-weight: 600; color: var(--white); margin: 0; text-transform: uppercase; letter-spacing: 0.04em; }
  .timeline-list { display: flex; flex-direction: column; gap: 14px; }
  .timeline-item { display: flex; gap: 10px; }
  .timeline-icon {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-tertiary);
  }
  .timeline-content { min-width: 0; }
  .timeline-title { font-size: 12.5px; color: var(--text-primary); }
  .timeline-body { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
  .timeline-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

  /* Dialogs */
  .dialog-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dialog-card { width: min(420px, 100%); background: var(--charcoal); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 22px; }
  .dialog-card h3 { font-size: 14.5px; font-weight: 600; color: var(--white); margin: 0 0 16px; }
  .dialog-fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .dialog-fields label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; }
  .dialog-fields input, .dialog-fields textarea {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line-strong); color: var(--white);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .dialog-fields input:focus, .dialog-fields textarea:focus { border-color: var(--red); outline: none; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog-error { color: var(--red-bright); font-size: 12px; margin: 10px 0 0; }

  /* ---------------------------------------------------------------
     Responsive
  ----------------------------------------------------------------*/
  @media (max-width: 900px) {
    .app-shell { grid-template-columns: 1fr; }
    .nav-rail {
      position: fixed; inset: 0 30% 0 0; z-index: 50;
      transform: translateX(-100%); transition: transform var(--duration-base) var(--ease);
      width: auto;
    }
    body.nav-open .nav-rail { transform: translateX(0); box-shadow: 40px 0 60px rgba(0,0,0,0.5); }
    .nav-scrim {
      display: none; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,0.5);
    }
    body.nav-open .nav-scrim { display: block; }
    .topbar-meta { display: none; }
    .nav-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
      background: none; color: var(--text-secondary); cursor: pointer;
    }
    .view-outlet { padding: 18px 16px 140px; }
    /* Docking is desktop-only — office.js skips edge-drag positioning
       below the mobile breakpoint and leaves these rules in charge:
       the orb stays a fixed bottom-right circle, and the panel /
       minimized bar become a full-width bottom sheet regardless of
       whichever anchor was last docked to on a larger screen. */
    .oyi-panel, .oyi-minimized-bar { left: 12px; right: 12px; bottom: 12px; top: auto; width: auto; min-width: 0; }

    /* Phase 2 — stack tables into label:value cards, never scroll horizontally */
    .detail-body { grid-template-columns: 1fr; }
    .fact-grid { grid-template-columns: 1fr; }
    .attention-row { grid-template-columns: 1fr; gap: 4px; }
    .attention-owner { text-align: left; }

    .crm-row.crm-row-head { display: none !important; }
    .crm-row {
      display: flex !important; flex-direction: column; gap: 6px; padding: 12px 14px;
    }
    .crm-row .cell {
      display: flex; justify-content: space-between; gap: 10px; white-space: normal;
      font-size: 12.5px;
    }
    .crm-row .cell::before {
      content: attr(data-label); color: var(--text-tertiary); font-size: 10.5px;
      text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0;
    }

    .list-toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-search { min-width: 0; }
    .toolbar-spacer { display: none; }

    .inline-form { flex-direction: column; align-items: stretch; }
    .inline-form input, .inline-form textarea { min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
