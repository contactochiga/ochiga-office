# Office regression for pull requests into the production branch (codex/office-extraction).
# PROPOSED AND DORMANT: the job runs only after a maintainer sets the repository variable OFFICE_CI_ENABLED to "true".
#
# Safety:
# - pull_request (never pull_request_target): the PR's code runs with a read-only token and no repository secrets.
#   Forks get no secrets either.
# - permissions: contents: read only; checkout does not persist the token.
# - No secrets, no production or hosted credentials, no deployment, no artifacts. Every database is a disposable
#   local container with synthetic data; the suites mock Meta and never send messages.
# - Actions pinned to commit SHAs; database images pulled by digest, then tagged to the names the suites expect.
# - Dependencies from the lockfile with install scripts disabled (no dependency has one).
# - npm run office:regression fails on any failing suite, any suite that prints SKIP, and any missing prerequisite.
name: Office regression

on:
  pull_request:
    branches: [codex/office-extraction]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: office-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    if: vars.OFFICE_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull the database images by digest
        run: |
          set -euo pipefail
          pull() { docker pull --quiet "$1@$2" >/dev/null && docker tag "$1@$2" "$1:$3" && echo "$1:$3 <- $2"; }
          pull public.ecr.aws/supabase/postgres sha256:42088c86593e0d4f47b2b2bd3c964cee31a1bbc8e560619fd3e84e5fdd973f6d 17.6.1.131
          pull public.ecr.aws/supabase/postgrest sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c v14.12
          pull node sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392 22-bookworm-slim
          pull postgres sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea 16-alpine

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          node --version
          docker version --format 'docker {{.Server.Version}}'
          test -x /usr/bin/google-chrome || { echo "BLOCKED: /usr/bin/google-chrome not found"; exit 1; }
          /usr/bin/google-chrome --version
          node scripts/run-office-regression.js --list

      - name: Office regression
        run: npm run office:regression
