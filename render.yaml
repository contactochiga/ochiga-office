services:
  - type: web
    name: ochiga-lead-agents
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run office:start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: LEAD_AGENTS_HOST
        value: 0.0.0.0
      - key: LEAD_AGENTS_PORT
        value: 10000
      - key: LEAD_AGENTS_STORE_DRIVER
        value: supabase
      - key: LEAD_AGENTS_AUTH_MODE
        value: required_api_key
      - key: LEAD_AGENTS_DEFAULT_SOURCE
        value: website_chat
      - key: LEAD_AGENTS_REQUEST_TIMEOUT_MS
        value: 120000
      - key: LEAD_AGENTS_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: LEAD_AGENTS_RATE_LIMIT_MAX_REQUESTS
        value: 60
      - key: OFFICE_EMAIL_FROM
        value: Ochiga Office <office@ochiga.com.ng>
      - key: OFFICE_APP_URL
        value: https://office.ochiga.com.ng
      - key: OFFICE_STORAGE_DIR
        value: data/office-storage
      - key: LEAD_AGENTS_ALLOWED_ORIGINS
        sync: false
      - key: LEAD_AGENTS_ADMIN_EMAIL
        sync: false
      - key: LEAD_AGENTS_ADMIN_PASSWORD
        sync: false
      - key: LEAD_AGENTS_SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LEAD_AGENTS_API_KEYS
        sync: false
      - key: OFFICE_FACILITY_BASE_URL
        sync: false
      - key: OFFICE_FACILITY_EXPORT_PATH
        sync: false
      - key: OFFICE_FACILITY_API_KEY
        sync: false
      - key: OFFICE_FACILITY_BEARER_TOKEN
        sync: false
      - key: OFFICE_CONSUMER_BASE_URL
        sync: false
      - key: OFFICE_CONSUMER_EXPORT_PATH
        sync: false
      - key: OFFICE_CONSUMER_API_KEY
        sync: false
      - key: OFFICE_CONSUMER_BEARER_TOKEN
        sync: false
      - key: OFFICE_BACKEND_BASE_URL
        sync: false
      - key: OFFICE_BACKEND_API_KEY
        sync: false
      - key: OFFICE_BACKEND_BEARER_TOKEN
        sync: false
      - key: OFFICE_BACKEND_CONVERSATION_PATH
        value: /office/conversation/corporate
      - key: OFFICE_BACKEND_INTERNAL_CONVERSATION_PATH
        value: /office/conversation/internal
      - key: OFFICE_BACKEND_EVENTS_ENABLED
        value: "false"
      - key: OFFICE_BACKEND_EVENT_PATH
        value: /office/events/material
      - key: OFFICE_EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FOUNDER_ALERT_WEBHOOK_URL
        sync: false
      - key: FOUNDER_ALERT_WEBHOOK_SECRET
        sync: false
      - key: DEMO_WEBHOOK_URL
        sync: false
      - key: DEMO_WEBHOOK_SECRET
        sync: false
      - key: SALES_ALERT_WEBHOOK_URL
        sync: false
      - key: SALES_ALERT_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
